<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Web - Culto en Vivo</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #0f0f0f; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .view { display: none; width: 100%; height: 100%; padding: 20px; flex-direction: column; justify-content: center; align-items: center; }
        .view.active { display: flex; }
        
        h1, h2 { margin-bottom: 20px; color: #3ecf8e; text-align: center; }
        button { background: #3ecf8e; color: #000; border: none; padding: 15px 30px; font-size: 18px; margin: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #34b27b; transform: scale(1.05); }
        
        .card { background: #1f1f1f; padding: 40px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); text-align: center; border: 1px solid #333; }

        /* Estilos Pantalla Receptora (TV) */
        #player-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative; background: #000; }
        #remoteVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .exit-btn { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); color: #fff; padding: 8px 15px; font-size: 14px; z-index: 10; border: 1px solid #555; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- VISTA 1: MENÚ PRINCIPAL -->
    <div id="view-selector" class="view active">
        <h1>Streaming Web - OpenSong</h1>
        <button onclick="switchView('view-broadcaster')">🖥️ Iniciar Transmisión (PC / Emisor)</button>
        <button onclick="switchView('view-receiver')">📺 Pantalla de TV (Receptor)</button>
    </div>

    <!-- VISTA 2: PANEL EMISOR (PC) -->
    <div id="view-broadcaster" class="view">
        <div class="card">
            <h2>Panel de Transmisión</h2>
            <p style="color: #aaa; font-size: 14px; margin-bottom: 20px;">Haz clic en iniciar, selecciona la ventana de <b>OpenSong</b> y compártela en directo con la web.</p>
            
            <button id="startBtn" onclick="startStreaming()" style="background: #007bff; color: #fff; width: 100%;">🔴 Iniciar Transmisión</button>
            <button id="stopBtn" onclick="stopStreaming()" style="background: #d9534f; color: #fff; width: 100%; display: none;">⏹ Detener Transmisión</button>
            
            <p id="status" style="font-size: 14px; color: #3ecf8e; margin-top: 20px; font-weight: bold;"></p>
            
            <button onclick="switchView('view-selector')" style="background: #444; color: #fff; margin-top: 30px; width: 100%; padding: 12px;">Volver al Menú</button>
        </div>
    </div>

    <!-- VISTA 3: PANTALLA RECEPTORA (TV) -->
    <div id="view-receiver" class="view" style="padding: 0;">
        <div id="player-container">
            <button class="exit-btn" onclick="switchView('view-selector')">⬅ Menú</button>
            <video id="remoteVideo" autoplay playsinline></video>
            <div id="waitingMsg" style="position: absolute; color: #aaa; font-size: 22px;">Esperando transmisión en vivo...</div>
        </div>
    </div>

    <!-- SDK DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://qcjxffgwtunyhrnmwjlh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_cg9V5TiS7hxAbi__t2lAQQ_wyMepCJ2'; // <-- Reemplaza con tu llave de Supabase

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let localStream = null;
        let peerConnection = null;
        let signalingChannel = null;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        window.switchView = function(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            if (viewId === 'view-receiver') {
                startReceiver();
            } else {
                stopReceiver();
            }
        };

        // ==========================================
        // LÓGICA DEL EMISOR (PC)
        // ==========================================
        async function startStreaming() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "Selecciona la ventana de OpenSong...";
                
                // Capturamos la pantalla/ventana elegida
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: "always" }, audio: false });

                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
                statusEl.innerText = "¡Transmitiendo en vivo!";

                // Indicamos en Supabase que la transmisión comenzó
                await supabaseClient.from('active_projection').upsert({ id: 1, data: { status: 'live' } });

                setupBroadcasterSignaling();

                // Si el usuario detiene la compartición desde el botón nativo del navegador
                localStream.getVideoTracks()[0].onended = () => {
                    stopStreaming();
                };

            } catch (err) {
                console.error("Error al iniciar stream:", err);
                statusEl.innerText = "No se pudo iniciar la transmisión.";
            }
        }

        async function stopStreaming() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (signalingChannel) {
                supabaseClient.removeChannel(signalingChannel);
            }

            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('status').innerText = "Transmisión detenida.";

            await supabaseClient.from('active_projection').upsert({ id: 1, data: { status: 'offline' } });
        }

        function setupBroadcasterSignaling() {
            signalingChannel = supabaseClient.channel('streaming_room');

            signalingChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                if (!peerConnection) return;
                if (payload.sdp) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                } else if (payload.candidate) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) {}
                }
            }).subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    peerConnection = new RTCPeerConnection(rtcConfig);
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    peerConnection.onicecandidate = event => {
                        if (event.candidate) {
                            signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { candidate: event.candidate } });
                        }
                    };

                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    signalingChannel.send({ type: 'broadcast', event: 'signal', payload: { sdp: peerConnection.localDescription } });
                }
            });
        }

        // ==========================================
        // LÓGICA DEL RECEPTOR (TV)
        // ==========================================
        let tvInterval = null;
        function startReceiver() {
            checkStreamStatus();
            tvInterval = setInterval(checkStreamStatus, 2000);
        }

        async function checkStreamStatus() {
            try {
                const { data } = await supabaseClient.from('active_projection').select('*').eq('id', 1).single();
                if (data && data.data && data.data.status === 'live') {
                    initReceiverWebRTC();
                }
            } catch (err) {}
        }

        function initReceiverWebRTC() {
            const remoteVideo = document.getElementById('remoteVideo');
            const waitingMsg = document.getElementById('waitingMsg');

            if (peerConnection && peerConnection.connectionState === 'connected') return;

            const receiverChannel = supabaseClient.channel('streaming_room');
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.ontrack = event => {
                remoteVideo.srcObject = event.streams[0];
                waitingMsg.style.display = 'none';
            };

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    receiverChannel.send({ type: 'broadcast', event: 'signal', payload: { candidate: event.candidate } });
                }
            };

            receiverChannel.on('broadcast', { event: 'signal' }, async ({ payload }) => {
                if (payload.sdp) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
                    if (payload.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        receiverChannel.send({ type: 'broadcast', event: 'signal', payload: { sdp: peerConnection.localDescription } });
                    }
                } else if (payload.candidate) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) {}
                }
            }).subscribe();
        }

        function stopReceiver() {
            if (tvInterval) clearInterval(tvInterval);
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('waitingMsg').style.display = 'block';
        }
    </script>
</body>
</html>
